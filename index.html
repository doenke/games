<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Spiele</title>
<meta name="theme-color" content="#1d5a45">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spiele">
<link rel="stylesheet" href="site.css">
</head>
<body>
<main>
  <header class="brand">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
      <g transform="rotate(-12 22 34)">
        <rect x="4" y="16" width="36" height="36" rx="8" fill="#fbfaf6"/>
        <g fill="#1b2420"><circle cx="13" cy="25" r="3.4"/><circle cx="22" cy="34" r="3.4"/><circle cx="31" cy="43" r="3.4"/></g>
      </g>
      <g transform="rotate(14 44 26)">
        <rect x="26" y="8" width="34" height="34" rx="8" fill="#f2c14e"/>
        <g fill="#2a2208"><circle cx="35" cy="17" r="3.2"/><circle cx="51" cy="17" r="3.2"/><circle cx="35" cy="33" r="3.2"/><circle cx="51" cy="33" r="3.2"/></g>
      </g>
    </svg>
    <div><h1>Spiele</h1><p>Kleine Helfer für den Spieltisch</p></div>
  </header>
  <ul class="games">
    <li>
      <a href="neandertaler/">
        <img src="neandertaler/icons/icon-192.png" alt="" width="56" height="56">
        <div><strong>Neandertaler</strong>
          <span>Zusatzkarten, Timer und Punkte für „Poesie für Neandertaler“</span></div>
      </a>
    </li>
    <li>
      <a href="kreuzblock/">
        <img src="kreuzblock/icons/icon-192.png" alt="" width="56" height="56">
        <div><strong>Kreuzblock</strong>
          <span>Ersatz-Wertungsblock für „Qwixx“</span></div>
      </a>
    </li>
  </ul>

  <button type="button" class="share" id="share">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor"
      d="M18 16.1c-.8 0-1.4.3-2 .8l-7.1-4.2c.1-.2.1-.5.1-.7s0-.5-.1-.7L16 7.2c.5.5 1.2.8 2 .8 1.7 0 3-1.3 3-3s-1.3-3-3-3-3 1.3-3 3c0 .2 0 .5.1.7L8 9.8C7.5 9.3 6.8 9 6 9c-1.7 0-3 1.3-3 3s1.3 3 3 3c.8 0 1.5-.3 2-.8l7.1 4.2c-.1.2-.1.4-.1.6 0 1.6 1.3 2.9 2.9 2.9s2.9-1.3 2.9-2.9-1.2-2.9-2.8-2.9z"/></svg>
    Link teilen
  </button>
  <p class="share-msg" id="shareMsg" role="status" hidden></p>

  <button type="button" class="install" id="install" hidden>Als App installieren</button>

  <footer><a href="kontakt.html">Kontakt &amp; Datenschutz</a></footer>
</main>
<script>
  // Teilt die Adresse der Übersicht: auf dem Handy über den Teilen-Dialog,
  // sonst wird der Link in die Zwischenablage kopiert.
  (function () {
    var btn = document.getElementById('share');
    var msg = document.getElementById('shareMsg');
    var url = location.origin + location.pathname.replace(/index\.html$/, '');
    var timer;

    function say(text) {
      msg.textContent = text;
      msg.hidden = false;
      clearTimeout(timer);
      timer = setTimeout(function () { msg.hidden = true; }, 4000);
    }

    function copy() {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(url).then(function () {
          say('Link kopiert: ' + url);
        }, function () { say(url); });
      } else {
        say(url);
      }
    }

    btn.addEventListener('click', function () {
      if (navigator.share) {
        navigator.share({ title: 'Spiele', text: 'Kleine Spiele-Helfer fürs Handy:', url: url })
          .catch(function (err) { if (err && err.name !== 'AbortError') copy(); });
      } else {
        copy();
      }
    });
  })();
</script>
<script>
  // Launcher: Service Worker der Übersicht und Installations-Knopf, wo der
  // Browser das anbietet (Chrome/Android). Auf dem iPhone: Teilen → „Zum Home-Bildschirm“.
  (function () {
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () {});
      });
    }
    var prompt = null;
    var btn = document.getElementById('install');
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      prompt = e;
      btn.hidden = false;
    });
    btn.addEventListener('click', function () {
      if (!prompt) return;
      prompt.prompt();
      prompt.userChoice.finally(function () { prompt = null; btn.hidden = true; });
    });
    window.addEventListener('appinstalled', function () { btn.hidden = true; });
  })();
</script>
</body>
</html>
